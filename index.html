<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec" data-storage-key="saad-theme" data-night-color="#171321">
<noscript><style>.email-box button, .theme-switch { display: none }</style></noscript>
<!--head-->
<script>
{
  const theme = document.querySelector('meta[name="theme-color"]');
  theme.dataset.dayColor = theme.content;
  try {
    if (localStorage.getItem(theme.dataset.storageKey) === 'night') {
      document.documentElement.dataset.theme = 'night';
      theme.content = theme.dataset.nightColor;
    }
  } catch {}
}
{
  const root = document.documentElement;
  root.setAttribute('data-opening', '');
  const finish = () => window.dispatchEvent(new Event('opening:complete'));
  const deadline = setTimeout(finish, 3600);
  const skip = event => { if (event.key === 'Tab' || event.key === 'Escape') finish(); };
  window.addEventListener('keydown', skip, true);
  window.addEventListener('opening:complete', () => {
    clearTimeout(deadline);
    root.removeAttribute('data-opening');
    document.getElementById('opening-screen')?.remove();
    window.removeEventListener('keydown', skip, true);
  }, { once: true });
}
</script>
</head>
<body>
<div id="opening-screen" class="opening-screen section-tone" hidden>
  <div class="opening-panel panel">
    <div class="opening-meter">
      <progress aria-label="Portfolio loading progress" value=".12" max="1"></progress>
      <sakuga-progress label="Portfolio loading progress" done-label="Ready ✓"></sakuga-progress>
    </div>
    <p class="opening-title" role="status">Loading portfolio</p>
  </div>
</div>
<div id="root"><!--app--></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
